# taotrader pre-registration (WP0). DESIGN.md v1.1 sections 2-3, 8.9, 9.1 and 10.4.
#
# Every default and threshold the design fixes BEFORE seeing results. ConfigApplied journals prereg_hash
# (blake2b-256 of the canonical JSON of this file's parsed content, so formatting and line endings do not matter).
# Any change is a research-protocol change: it needs an ADR, it changes prereg_hash, and every report states which
# hash it ran under. [risk] and [exec] must equal the core.config defaults (tests/ops/test_config_load.py checks it).
# Units are in the key names (_blocks, _ppm, _rao, _tao, _pct_day, _frac, _days); bare fractions are plain ratios.
# kind: T = P&L-tuned (counted in the budget of 11), F = frozen, C = calibrated against a non-P&L target.

