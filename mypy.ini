# taotrader mypy configuration (WP0). DESIGN.md section 10.6: mypy --strict on all packages.
# Usage: .venv/Scripts/python.exe -m mypy            (checks `files` below)
#        .venv/Scripts/python.exe -m mypy --strict <paths>
[mypy]
python_version = 3.11
strict = True
mypy_path = src
files = src/taotrader, tools
explicit_package_bases = True
show_error_codes = True
pretty = False

# Optional / platform-specific third-party packages without type information.
[mypy-scalecodec.*]
ignore_missing_imports = True

[mypy-bittensor.*]
ignore_missing_imports = True

# Tests are type-checked, but helper functions in tests need not be fully annotated.
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
